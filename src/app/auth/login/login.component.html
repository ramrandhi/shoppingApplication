<div class="container">

    <div class="login-container">
        <h1>Sign in</h1>
        <span>Email or mobile phone number</span>
        <input />
        <span><button class="continueBtn" (click)="onContinueButtonClicked()">continue</button></span>
        <div class="privacyPolicy">
          <span>By continuing, you agree to Amazon's <a href="#">Conditions of Use</a> and <a href="#">Privacy
              Notice</a>.</span>
        </div>
        <div class="needHelp"> <a href="#">Need help?</a></div> <!--<mat-icon>play_arrow</mat-icon> -->
        <div class="horizontal-line"></div>
        <div class="RandomText">Buying for work?</div>
        <div class="AmazonBusiness"><a href="#">Shop on amcozie Business</a></div>
    </div>
    <div class="register-container">
      <div class="Register-header">
        <div class="divider"></div>
        <span class="ledivider">New To Amcozie?</span>
        <div class="divider"></div>
      </div>
      <button class="Register-Btn" (click)="redirectToRegistrationPage()"><span>Create Your Amcozie
          Account</span></button>

  </div>
  <div class="more">
    <div class="line"></div>
