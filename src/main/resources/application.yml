server:
  port: 8081

spring:
  application:
    name: common-service

  datasource:
    url: jdbc:mysql://localhost:3306/common
    username: hcn
    password: admin@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: true
        format_sql: true
        envers:
          enabled: true
        hbm2ddl:
          auto: update
    mapping-files:
      - classpath:META-INF/orm.xml

  logging:
    pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [${spring.application.name}] %logger{36} - %msg%n"
